name: Build Huawei Tablet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compile Release & Debug APK
        run: |
          cd zoom-caption-transcriber-huawei-tablet-v5.0
          gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Huawei Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoomCaptionTranscriber-Huawei-APK
          path: |
            zoom-caption-transcriber-huawei-tablet-v5.0/app/build/outputs/apk/release/*.apk

            zoom-caption-transcriber-huawei-tablet-v5.0/app/build/outputs/apk/debug/*.apk
